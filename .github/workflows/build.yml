name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build portable app
        run: npm run build

      - name: Zip
        shell: pwsh
        run: |
          $src = Get-ChildItem -Directory .. -Filter "Release V*" | Select-Object -First 1
          if (-not $src) { throw "Build output folder not found" }
          Compress-Archive -Path "$($src.FullName)\*" -DestinationPath "SteamEdge-v${{ steps.ver.outputs.v }}-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SteamEdge-win-x64
          path: SteamEdge-v${{ steps.ver.outputs.v }}-win-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SteamEdge-v${{ steps.ver.outputs.v }}-win-x64.zip
